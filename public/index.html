<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>家</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="drawer" class="drawer">
    <div class="drawer-head">
      <span>会话</span>
      <button id="newChat">＋ 新会话</button>
    </div>
    <ul id="sessionList"></ul>
  </div>
  <div id="mask" class="mask"></div>

  <main class="chat">
    <header>
      <button id="menuBtn" aria-label="会话列表">☰</button>
      <div class="who">
        <div class="avatar">🦊<i id="dot"></i></div>
        <div class="who-text">
          <h1>麦穗</h1>
          <small id="statusText">在线</small>
        </div>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <div id="pendingBar" class="pending" hidden>
      <img id="pendingThumb" alt="" hidden />
      <span id="pendingName"></span>
      <button id="pendingRemove">✕</button>
    </div>

    <footer>
      <button id="imgBtn" class="attach" aria-label="发图片">🖼</button>
      <button id="fileBtn" class="attach" aria-label="发文件">＋</button>
      <input id="imgInput" type="file" accept="image/*" hidden />
      <input id="fileInput" type="file" hidden />
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="sendBtn" aria-label="发送">➤</button>
      <button id="stopBtn" aria-label="打断" hidden>■</button>
    </footer>
  </main>

  <script src="marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
