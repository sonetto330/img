<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>家</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 首页视图 -->
  <section id="homeView" class="view active">
    <div class="home-scroll">
      <div class="home-top">
        <div class="clock">
          <div class="time" id="homeTime">--:--</div>
          <div class="date" id="homeDate"></div>
        </div>
        <div class="weather" id="weatherBox" hidden>
          <span class="weather-icon" id="weatherIcon">—</span>
          <span class="weather-temp"><span id="weatherTemp">—</span>°</span>
          <span class="weather-range"><span id="weatherHi">—</span>°<span class="sep">/</span><span id="weatherLo">—</span>°</span>
        </div>
      </div>

      <div class="greeting" id="greeting">跟麦穗说点什么？</div>

      <div class="home-divider"></div>

      <div class="together">
        <div class="together-days">
          <span class="num" id="daysTogether">—</span>
          <span class="unit">天</span>
        </div>
        <div class="together-sub">在一起 · 自 2025.12.24</div>
      </div>

      <div class="msg-count" id="msgCountRow">
        <span class="num" id="msgCount">—</span>
        <span class="unit" id="msgCountUnit">条消息 · 全部会话</span>
      </div>

      <div class="home-grid">
        <button class="card card-chat" data-route="chat">
          <div class="card-icon">💬</div>
          <div class="card-title">聊天</div>
          <div class="card-sub" id="chatCardSub">跟麦穗说话</div>
        </button>
        <button class="card" data-route="memory">
          <div class="card-icon">🧠</div>
          <div class="card-title">记忆库</div>
          <div class="card-sub" id="memoryCardSub">看你们的星图</div>
        </button>
        <button class="card card-disabled" data-route="settings" disabled>
          <div class="card-icon">⚙️</div>
          <div class="card-title">设置</div>
          <div class="card-sub">还没建好</div>
        </button>
      </div>
    </div>
  </section>

  <!-- 记忆库视图（星图） -->
  <section id="memoryView" class="view" hidden>
    <div class="memory-topbar">
      <button id="memoryBack" class="memory-back" aria-label="回首页">◀</button>
      <div class="memory-title">
        <span>星图</span>
        <small id="memoryMeta"></small>
      </div>
    </div>
    <canvas id="memoryCanvas"></canvas>
    <div id="memoryEmpty" class="memory-empty" hidden>
      <div class="empty-title">还没有记忆</div>
      <div class="empty-sub">跟麦穗多聊几句关于你日常的事，他会悄悄记下。<br>攒到 10 条以上就会出现在这里。</div>
    </div>
    <div id="memoryDetail" class="memory-detail" hidden>
      <div class="detail-head">
        <span class="detail-kind" id="detailKind"></span>
        <span class="detail-name" id="detailName"></span>
        <button class="detail-close" id="detailClose" aria-label="关闭">✕</button>
      </div>
      <div id="detailProfile" class="detail-profile" hidden></div>
      <div id="detailFragments" class="detail-fragments"></div>
    </div>
  </section>

  <!-- 聊天视图（原来的整个界面） -->
  <section id="chatView" class="view" hidden>
    <div id="drawer" class="drawer">
      <div class="drawer-head">
        <span>会话</span>
        <button id="newChat">＋ 新会话</button>
      </div>
      <ul id="sessionList"></ul>
    </div>
    <div id="mask" class="mask"></div>

    <main class="chat">
      <header>
        <button id="backHome" aria-label="回首页">◀</button>
        <button id="menuBtn" aria-label="会话列表">☰</button>
        <div class="who">
          <div class="who-text">
            <h1>麦穗<i id="dot"></i></h1>
            <small id="statusText">在线</small>
          </div>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <div id="pendingBar" class="pending" hidden></div>

      <footer>
        <button id="attachBtn" class="attach" aria-label="加附件">＋</button>
        <input id="fileInput" type="file" multiple hidden />
        <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
        <button id="sendBtn" aria-label="发送">➤</button>
        <button id="stopBtn" aria-label="打断" hidden>■</button>
      </footer>
    </main>
  </section>

  <!-- 底部导航（聊天视图打开时会自动隐藏） -->
  <nav id="bottomNav" class="bottom-nav">
    <button data-view="home" class="nav-btn active">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">首页</span>
    </button>
    <button data-view="chat" class="nav-btn">
      <span class="nav-icon">💬</span>
      <span class="nav-label">聊天</span>
    </button>
    <button data-view="memory" class="nav-btn">
      <span class="nav-icon">🧠</span>
      <span class="nav-label">记忆库</span>
    </button>
    <button data-view="settings" class="nav-btn" disabled>
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>

  <script src="marked.min.js"></script>
  <script src="app.js"></script>
  <script src="starmap.js"></script>
</body>
</html>
